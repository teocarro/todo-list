<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_Todo SueList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="titolo">
    <h1>C_Todo SueList</h1>
</div>

<div id="sezioneNuovo">
    <input type="date" id="dataTask">
    <input type="text" id="descrizioneTask">
    <button id="pulsanteAggiungi">Aggiungi</button>
</div>

<div id="sezioneInProgress">
    <h1 id="daCompletare">DA COMPLETARE</h1>

    <div id="intestazioni">
        <button id="intestazioneData" title="clicca per ordinare in modo crescente/decrescente"></button>
        <span id="intestazioneDescrizione">Descrizione TASK</span>
    </div>

    <ul id="listaDaCompletare"></ul>
</div>

<div id="sezioneCompletati">
    <h1 id="completati">COMPLETATI</h1>
    <ul id="listaCompletati"></ul>
</div>

<script src="script.js"></script>

</body>
</html>
